[package]
name = "dns-x"
version = "1.1.0"
description = "Local domains, one Mac."
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
tempfile = "3"
hickory-proto = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
url = "2"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
