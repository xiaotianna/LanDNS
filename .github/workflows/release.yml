name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # shortcut: Ad-hoc signing is not notarized; add Developer ID signing for verified distribution.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tauriScript: npm run tauri
          args: --target universal-apple-darwin --bundles app,dmg -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: LanDNS ${{ github.ref_name }}
          releaseBody: |
            macOS 14 或更新版本，适用于 Apple Silicon 和 Intel Mac。
            下载 .dmg，打开后将 LanDNS 拖入「应用程序」。

            当前安装包使用临时签名，尚未经过 Apple 公证。首次打开可能需要在「系统设置 → 隐私与安全性」中确认允许。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
